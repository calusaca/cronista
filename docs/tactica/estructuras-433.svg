<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="490" viewBox="0 0 1420 490" role="img" aria-labelledby="title desc">
<title id="title">Un mismo once en tres estructuras tácticas propuestas</title>
<desc id="desc">Tres canchas muestran los mismos once puestos: formación base 4-3-3, ocupación con balón 3-2-5 y defensa 4-1-4-1. Se destaca el lateral izquierdo con un anillo. Son objetivos nominales de juego abierto, no posiciones de saque inicial ni trayectorias observadas.</desc>
